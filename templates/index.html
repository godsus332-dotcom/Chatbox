<!DOCTYPE html>
<html>
<head>
    <title>Hacker Chat</title>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>

    <style>
        body {
            background: black;
            color: #00ff00;
            font-family: monospace;
        }

        input, button {
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 5px;
            margin-top: 5px;
        }

        #chat {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #00ff00;
            padding: 10px;
            margin-top: 10px;
        }

        #users {
            border: 1px solid #00ff00;
            padding: 10px;
            margin-top: 10px;
        }

        .system {
            color: yellow;
        }
    </style>
</head>

<body>

<h2>🔐 LOGIN</h2>

<input id="username" placeholder="Username"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>

<p id="status"></p>

<!-- CHAT UI (hidden until login) -->
<div id="chatUI" style="display:none;">

    <h2>💬 CHAT</h2>

    <div id="chat"></div>

    <input id="msg" placeholder="Type message..." disabled>
    <button onclick="sendMsg()">Send</button>

    <h3>👥 ONLINE USERS</h3>
    <div id="users"></div>

</div>

<script>
let socket = io();
let loggedIn = false;

// ================= LOGIN =================
function login(){
    let u = document.getElementById("username").value;
    let p = document.getElementById("password").value;

    socket.emit("login", {username:u, password:p});
}

// ================= LOGIN RESPONSE =================
socket.on("login_success", (data)=>{
    loggedIn = true;

    document.getElementById("status").innerText = "Logged in as " + data.username;

    document.getElementById("chatUI").style.display = "block";
    document.getElementById("msg").disabled = false;
});

socket.on("login_error", (msg)=>{
    document.getElementById("status").innerText = msg;
});

// ================= SEND =================
function sendMsg(){
    if (!loggedIn) return;

    let msg = document.getElementById("msg").value;
    if (msg.trim() === "") return;

    socket.send(msg);
    document.getElementById("msg").value = "";
}

// ================= RECEIVE MESSAGE =================
socket.on("message", (msg)=>{
    if (!loggedIn) return;

    let chat = document.getElementById("chat");

    let line = document.createElement("div");

    if (msg.includes("[SYSTEM]")) {
        line.className = "system";
    }

    line.innerText = msg;

    chat.appendChild(line);

    // auto scroll
    chat.scrollTop = chat.scrollHeight;
});

// ================= USER LIST =================
socket.on("user_list", (users)=>{
    if (!loggedIn) return;

    let box = document.getElementById("users");
    box.innerHTML = "";

    users.forEach(u => {
        let div = document.createElement("div");
        div.innerText = ">> " + u;
        box.appendChild(div);
    });
});

// ================= ENTER KEY SEND =================
document.addEventListener("keydown", function(e){
    if (e.key === "Enter") {
        sendMsg();
    }
});
</script>

</body>
</html>
