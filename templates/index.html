<!DOCTYPE html>
<html>
<head>
    <title>Chatbox</title>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
</head>
<body>

<h2>Chatbox</h2>

<!-- LOGIN -->
<div id="login">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="loginStatus"></p>
</div>

<!-- CHAT -->
<div id="chat" style="display:none;">
    <ul id="messages"></ul>

    <input id="msg" placeholder="Message">
    <button onclick="sendMsg()">Send</button>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display:none;">
        <h3>Admin Panel</h3>

        <input id="targetUser" placeholder="Username">

        <button onclick="kickUser()">Kick</button>
        <button onclick="banUser()">Ban</button>
        <button onclick="unbanUser()">Unban</button>

        <br><br>

        <input id="newUser" placeholder="New Username">
        <input id="newPass" placeholder="Password">
        <button onclick="addUser()">Add User</button>

        <br><br>

        <button onclick="deleteUser()">Delete User</button>
    </div>
</div>

<script>
var socket = io();
let isAdmin = false;

function login() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    socket.emit("login", {
        username: username,
        password: password
    });
}

socket.on("login_response", function(data) {
    if (data.status === "ok") {
        document.getElementById("login").style.display = "none";
        document.getElementById("chat").style.display = "block";

        if (data.role === "admin") {
            isAdmin = true;
            document.getElementById("adminPanel").style.display = "block";
        }
    }
    else if (data.status === "banned") {
        document.getElementById("loginStatus").innerText = "You are banned!";
    }
    else {
        document.getElementById("loginStatus").innerText = "Login failed!";
    }
});

function sendMsg() {
    let msg = document.getElementById("msg").value;
    socket.send(msg);
    document.getElementById("msg").value = "";
}

socket.on("message", function(msg) {
    let li = document.createElement("li");
    li.textContent = msg;
    document.getElementById("messages").appendChild(li);
});

/* ADMIN FUNCTIONS */

function kickUser() {
    if (!isAdmin) return;
    socket.emit("kick", { user: getTarget() });
}

function banUser() {
    if (!isAdmin) return;
    socket.emit("ban", { user: getTarget() });
}

function unbanUser() {
    if (!isAdmin) return;
    socket.emit("unban", { user: getTarget() });
}

function addUser() {
    if (!isAdmin) return;
    socket.emit("add_user", {
        username: document.getElementById("newUser").value,
        password: document.getElementById("newPass").value
    });
}

function deleteUser() {
    if (!isAdmin) return;
    socket.emit("delete_user", { username: getTarget() });
}

function getTarget() {
    return document.getElementById("targetUser").value;
}
</script>

</body>
</html>
