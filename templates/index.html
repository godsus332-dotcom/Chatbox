<!DOCTYPE html>
<html>
<head>
    <title>Hacker Chat</title>

<style>
body {
    background: black;
    color: #00ff00;
    font-family: monospace;
}

input, button {
    background: black;
    color: #00ff00;
    border: 1px solid #00ff00;
    padding: 5px;
}

#chat {
    height: 300px;
    overflow-y: scroll;
    border: 1px solid #00ff00;
    padding: 10px;
}

#users {
    border: 1px solid #00ff00;
    padding: 10px;
    margin-top: 10px;
}

.typing {
    color: yellow;
    font-size: 12px;
}
</style>

</head>

<body>

<h2>LOGIN</h2>
<input id="username" placeholder="username"><br><br>
<input id="password" type="password" placeholder="password"><br><br>
<button onclick="login()">Login</button>

<h2>CHAT</h2>

<div id="chat"></div><br>

<input id="message" placeholder="type message..." oninput="typing()">
<button onclick="sendMessage()">Send</button>

<div class="typing" id="typing"></div>

<h3>ONLINE USERS</h3>
<div id="users"></div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
const socket = io();
let currentUser = "";

// LOGIN
function login() {
    socket.emit("login", {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
    });
}

socket.on("login_success", (data) => {
    currentUser = data.username;
    alert("Logged in as " + currentUser);
});

socket.on("login_error", (msg) => {
    alert(msg);
});

// MESSAGE SEND
function sendMessage() {
    const msg = document.getElementById("message").value;
    socket.send(msg);
    document.getElementById("message").value = "";
}

// RECEIVE MESSAGE
socket.on("message", (msg) => {
    const div = document.createElement("div");

    // typing animation effect
    let i = 0;
    function typeWriter() {
        if (i < msg.length) {
            div.innerHTML += msg.charAt(i);
            i++;
            setTimeout(typeWriter, 20);
        }
    }
    typeWriter();

    document.getElementById("chat").appendChild(div);
});

// TYPING
function typing() {
    socket.emit("typing");
}

socket.on("typing", (msg) => {
    document.getElementById("typing").innerText = msg;
    setTimeout(() => {
        document.getElementById("typing").innerText = "";
    }, 1000);
});

// ONLINE USERS
socket.on("user_list", (users) => {
    document.getElementById("users").innerHTML =
        users.map(u => ">> " + u).join("<br>");
});
</script>

</body>
</html>
