<!DOCTYPE html>
<html>
<head>
    <title>Chatbox</title>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>

    <style>
        body {
            background: black;
            color: #00ff00;
            font-family: monospace;
        }

        #login {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        input, button {
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            margin: 5px;
        }

        #chatbox {
            display: none;
            padding: 20px;
        }

        #chat {
            height: 300px;
            border: 1px solid #00ff00;
            overflow-y: auto;
            padding: 10px;
        }

        .system {
            color: #00ffff;
        }

        .user {
            color: #00ff00;
        }
    </style>
</head>

<body>

<div id="login">
    <h2>LOGIN</h2>
    <input id="username" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
</div>

<div id="chatbox">
    <h2>CHAT</h2>

    <div id="chat"></div>

    <input id="msg" placeholder="Type message...">
    <button onclick="sendMsg()">Send</button>

    <h3>ONLINE USERS</h3>
    <div id="users"></div>
</div>

<script>
var socket = io();

// ================= LOGIN =================
function login() {
    socket.emit("login", {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
    });
}

// ================= EVENTS =================
socket.on("login_success", function() {
    document.getElementById("login").style.display = "none";
    document.getElementById("chatbox").style.display = "block";
});

socket.on("login_error", function(msg) {
    alert(msg);
});

// ================= CHAT HISTORY =================
socket.on("chat_history", function(data) {
    let chat = document.getElementById("chat");
    chat.innerHTML = "";

    data.forEach(msg => {
        chat.innerHTML += msg + "<br>";
    });
});

// ================= MESSAGE =================
socket.on("message", function(data) {
    let chat = document.getElementById("chat");

    let line = "";

    if (typeof data === "object") {
        // NEW FORMAT
        if (data.user === "SYSTEM") {
            line = `<span class="system">[SYSTEM] ${data.msg}</span>`;
        } else {
            line = `<span class="user">[${data.user}] ${data.msg}</span>`;
        }
    } else {
        // OLD FORMAT (history fallback)
        line = data;
    }

    chat.innerHTML += line + "<br>";
    chat.scrollTop = chat.scrollHeight;
});

// ================= USERS =================
socket.on("user_list", function(users) {
    let box = document.getElementById("users");
    box.innerHTML = "";

    users.forEach(u => {
        box.innerHTML += ">> " + u + "<br>";
    });
});

// ================= FORCE DISCONNECT =================
socket.on("force_disconnect", function() {
    alert("You were kicked by admin");
    location.reload();
});

// ================= SEND =================
function sendMsg() {
    let msg = document.getElementById("msg").value;

    if (!msg.trim()) return;

    socket.send(msg);
    document.getElementById("msg").value = "";
}
</script>

</body>
</html>
